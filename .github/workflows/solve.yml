name: chip404-solver
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'nonce start'
        required: true
        default: '4000000000000'
      runtime_min:
        description: 'minutes'
        required: false
        default: '50'
jobs:
  solve:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Build + mine (AVX-512, 4 threads, 2^216)
        run: |
          gcc -O3 -march=native -funroll-loops -mavx512f -o avx chip404_avx512.c -lpthread 2>/dev/null || gcc -O3 -funroll-loops -DNO_AVX512 -o avx chip404_avx512.c -lpthread
          END=$((SECONDS + ${{ github.event.inputs.runtime_min }} * 60))
          timeout $((END - SECONDS)) ./avx ${{ github.event.inputs.start }} 4 > miner.log 2>&1
          RC=$?
          echo "miner exit: $RC"
          grep -a "FOUND nonce" miner.log || echo "not found"
          tail -1 miner.log
